name: Release Stream Vessel plugin

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release for review
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: streamvessel-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and build package
        id: package
        run: python3 scripts/build_plugin.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Version already tagged: $RELEASE_TAG. Bump plugin.json before releasing again."
            exit 1
          fi
          args=(--target "$GITHUB_SHA" --title "Stream Vessel $RELEASE_VERSION" --generate-notes)
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "${args[@]}"
